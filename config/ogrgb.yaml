substitutions:
  device_name: ogrgb

esphome:
  name: ${device_name}
  friendly_name: OpenGarage RGB Status
  min_version: 2026.8.0
  project:
    name: identd113.esp32_ogrgb
    version: "2.0.0"
  platformio_options:
    build_type: release
    build_flags:
      - -Os
      - -DCONFIG_ESP32_WIFI_DYNAMIC_TX_BUF
  on_boot:
    # Below the globals' HARDWARE priority (800), so saved values are restored first.
    priority: 600
    then:
      - logger.log: "Boot successful."
      - lambda: 'id(boot_count)++;'
      - lambda: |
          // A deep-sleep wake continues the battery session; power-on or reset starts a new one.
          id(cold_boot) = (esp_reset_reason() != ESP_RST_DEEPSLEEP);
          if (id(cold_boot)) {
            // Power-on or reset: forget the saved door state and the wait extension.
            id(session_wakes) = 0;
            id(door_open) = false;
            id(door_known) = false;
            id(wait_extra_s) = 0;
            id(wake_pending) = true;
          }
      - deep_sleep.prevent: deep_sleep_1

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  cpu_frequency: 80MHz
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: NONE
  output_power: 19.5
  # DHCP reservation on the router (MAC d8:3b:da:99:63:e0); a static IP skips the DHCP exchange.
  manual_ip:
    static_ip: 10.0.2.152
    gateway: 10.0.2.1
    subnet: 255.255.254.0
    dns1: 10.0.2.1
  on_connect:
    - lambda: 'id(wifi_ms) = millis();'

logger:
  level: INFO
  baud_rate: 0
  on_message:
    level: INFO
    then:
      - lambda: |-
          if (id(online_lock)) {
            std::string topic = App.get_name() + std::string("/logs");
            std::string msg = std::string("[") + tag + "] " + message;
            id(mqtt_client)->publish(topic.c_str(), msg.c_str(), msg.size(), 0, false);
          }

ota:
  platform: esphome
  password: !secret ota_password

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: !secret mqtt_port
  client_id: "${device_name}"
  discovery: false
  log_topic: null

  birth_message:
    topic: "${device_name}/status"
    payload: "online"
    qos: 1
    retain: true

  will_message:
    topic: "${device_name}/status"
    payload: "offline"
    qos: 1
    retain: true

  on_connect:
    then:
      - lambda: |
          id(mqtt_ms) = millis();
          id(seen_mask) = 0;
          id(ready) = true;
          id(sleep_timeout_expired) = false;
      - lambda: |
          // Heartbeat: one message per timer wake, published after the MQTT connection is up.
          if (id(wake_pending)) {
            id(wake_pending) = false;
            char buf[200];
            snprintf(buf, sizeof(buf),
              "{\"wake_count\":%u,\"session_wakes\":%u,\"cold_boot\":%s,\"timer_wake\":%s,\"door_known\":%s,\"wait_extra_s\":%u}",
              (unsigned)id(wake_count),
              (unsigned)id(session_wakes),
              id(cold_boot) ? "true" : "false",
              id(wake_is_timer) ? "true" : "false",
              id(door_known) ? "true" : "false",
              (unsigned)id(wait_extra_s));
            id(mqtt_client)->publish(
              (std::string)App.get_name() + "/wake", buf, strlen(buf), 1, true);
          }
      - script.execute: arm_sleep_timeout

  on_message:
    - topic: "${device_name}/online_lock"
      qos: 1
      then:
        - lambda: |
            id(online_lock) = (x == "true");
            id(seen_mask) |= 0x01;
        - script.execute: online_lock_timeout_arm
        - script.execute: request_recompute

    - topic: "My OpenGarage/OUT/STATUS"
      qos: 1
      then:
        - lambda: |
            id(og_online) = (x == "online");
            id(seen_mask) |= 0x02;
        - script.execute: request_recompute

    # Live only (not retained): arrives about every 18 s while the device is awake.
    - topic: "My OpenGarage/OUT/STATE"
      qos: 0
      then:
        - lambda: |
            id(door_open) = (x == "OPEN");
            id(door_known) = true;
            id(wait_extra_s) = 0;
            id(door_seen_this_wake) = true;
            id(seen_mask) |= 0x04;
        - script.execute: request_recompute

globals:
  # Door state from OpenGarage. Restored so the light holds through deep sleep;
  # cleared on a cold boot in on_boot.
  - id: door_open
    type: bool
    initial_value: "false"
    restore_value: true
  # True once a door state has been received since the last power-on or reset.
  - id: door_known
    type: bool
    initial_value: "false"
    restore_value: true
  # Extra seconds added to the wait window while no door message arrives (0 to 60).
  - id: wait_extra_s
    type: uint32_t
    initial_value: "0"
    restore_value: true
  - id: og_online
    type: bool
    initial_value: "true"
  - id: online_lock
    type: bool
    initial_value: "false"

  # Bitmask: bit0 = online_lock, bit1 = og_online, bit2 = door_open
  - id: seen_mask
    type: uint8_t
    initial_value: "0"
  - id: ready
    type: bool
    initial_value: "false"

  - id: sleep_timeout_expired
    type: bool
    initial_value: "false"

  - id: last_color
    type: uint8_t
    initial_value: "255"
    restore_value: true

  - id: boot_count
    type: uint32_t
    initial_value: "0"
    restore_value: true

  # Wake heartbeat. Restored so the count survives deep sleep.
  - id: wake_count
    type: uint32_t
    initial_value: "0"
    restore_value: true
  # Set when a door message arrives during the current wake.
  - id: door_seen_this_wake
    type: bool
    initial_value: "false"
  # Wakes since the last power-on or reset. Reset to 0 on a cold boot; kept across deep sleep.
  - id: session_wakes
    type: uint32_t
    initial_value: "0"
    restore_value: true
  # Set in on_boot each time the device starts; true after power-on or reset.
  - id: cold_boot
    type: bool
    initial_value: "false"

  # Milliseconds since boot when Wi-Fi and MQTT came up this wake. Published in flags.
  - id: wifi_ms
    type: uint32_t
    initial_value: "0"
  - id: mqtt_ms
    type: uint32_t
    initial_value: "0"

  # Set on each wake; used only within that wake.
  - id: wake_is_timer
    type: bool
    initial_value: "false"
  - id: wake_pending
    type: bool
    initial_value: "false"

deep_sleep:
  id: deep_sleep_1
  run_duration: 3s
  sleep_duration: 30s
  on_wake:
    - lambda: |
        id(wake_count)++;
        id(session_wakes)++;
        id(wake_is_timer) = (cause == deep_sleep::WAKEUP_CAUSE_TIMER);
        id(door_seen_this_wake) = false;
        id(wake_pending) = true;

light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    channel_colors: GRB

    name: "${device_name} Light"
    id: ogrgb_light
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - mqtt.publish:
          topic: "${device_name}/light/light_status"
          payload: "on"
          qos: 1
          retain: true
      - lambda: 'ESP_LOGD("Light", "Light turned on");'
    on_turn_off:
      - mqtt.publish:
          topic: "${device_name}/light/light_status"
          payload: "off"
          qos: 1
          retain: true
      - lambda: 'ESP_LOGD("Light", "Light turned off");'
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10

script:
  # Door wait. Unknown door (first boot): wait up to 60 s for a door message.
  # Known door: do not wait, and assume it is unchanged. Each wake without a door message
  # adds 2 s to the next wait; a door message resets it to 0.
  - id: arm_sleep_timeout
    mode: restart
    then:
      - delay: !lambda 'return id(door_known) ? (uint32_t)(id(wait_extra_s) * 1000) : 60000;'
      # The two retained topics arrive right after connect. Hold sleep until they have
      # (online_lock decides whether to stay awake), but not forever if the broker is slow.
      - wait_until:
          condition:
            lambda: 'return (id(seen_mask) & 0x03) == 0x03;'
          timeout: 5s
      # The debounced recompute may not have run yet; update the light and publish now.
      - script.execute: recompute_and_publish
      - script.wait: recompute_and_publish
      - lambda: |-
          if (!id(sleep_timeout_expired)) {
            id(sleep_timeout_expired) = true;
            ESP_LOGI("sleep", "Door wait expired (door_known=%d, extra=%u s).", (int)id(door_known), (unsigned)id(wait_extra_s));
          }
          // No door message this wake while the door is known: widen the next wait by 2 s,
          // and reset to 0 once a miss happens at 60 s.
          if (id(door_known) && !id(door_seen_this_wake)) {
            if (id(wait_extra_s) >= 60) {
              id(wait_extra_s) = 0;
            } else {
              id(wait_extra_s) += 2;
            }
          }
      - script.execute: maybe_finish_and_sleep

  # Debounce: the three retained topics arrive together on a wake, so wait briefly
  # and run the light update and state publish once. It then decides whether to sleep.
  - id: request_recompute
    mode: restart
    then:
      - delay: 500ms
      - script.execute: recompute_and_publish
      - script.execute: maybe_finish_and_sleep

  - id: recompute_and_publish
    mode: queued
    then:
      - lambda: |-
          uint8_t color = 0;

          if (id(door_open) && id(og_online)) {
            color = 0;
          } else if (id(door_open) && !id(og_online)) {
            color = 1;
          } else if (!id(door_open) && id(og_online)) {
            color = 2;
          } else {
            color = 3;
          }

          if (color == 0) {
            id(ogrgb_light).turn_on().set_brightness(0.40).set_rgb(0.0, 1.0, 0.0).perform();
          } else if (color == 1) {
            id(ogrgb_light).turn_on().set_brightness(0.40).set_rgb(0.0, 0.0, 1.0).perform();
          } else if (color == 2) {
            id(ogrgb_light).turn_off().perform();
          } else {
            id(ogrgb_light).turn_on().set_brightness(0.40).set_rgb(1.0, 0.0, 0.0).perform();
          }

          if (color != id(last_color)) {
            id(last_color) = color;
            const char *cname = (color == 0) ? "green" : (color == 1) ? "blue" : (color == 2) ? "none" : "red";
            id(mqtt_client)->publish(
              (std::string)App.get_name() + "/light/light_color",
              cname,
              strlen(cname),
              1,
              true
            );
          }

          const char *cname2 =
            (id(last_color) == 0) ? "green" :
            (id(last_color) == 1) ? "blue" :
            (id(last_color) == 2) ? "none" : "red";
          char buf[160];
          snprintf(buf, sizeof(buf),
            "{\"door_open\":%s,\"og_online\":%s,\"color\":\"%s\",\"boots\":%u}",
            id(door_open) ? "true" : "false",
            id(og_online) ? "true" : "false",
            cname2,
            (unsigned)id(boot_count)
          );
          id(mqtt_client)->publish(
            (std::string)App.get_name() + "/state",
            buf,
            strlen(buf),
            1,
            true
          );

  - id: maybe_finish_and_sleep
    mode: restart
    then:
      - lambda: 'if (!id(ready)) return;'
      - if:
          condition:
            lambda: 'return id(sleep_timeout_expired);'
          then:
            - if:
                condition:
                  lambda: 'return id(online_lock);'
                then:
                  - lambda: |-
                      uint8_t missing = (~id(seen_mask)) & 0x07;
                      std::string missing_list;
                      if (missing & 0x01) missing_list += (missing_list.empty() ? "" : ", ") + std::string("online_lock");
                      if (missing & 0x02) missing_list += (missing_list.empty() ? "" : ", ") + std::string("garage_status");
                      if (missing & 0x04) missing_list += (missing_list.empty() ? "" : ", ") + std::string("light_control");
                      if (missing_list.empty()) missing_list = "none";
                      ESP_LOGI("sleep", "Sleep timeout expired but online lock active; remaining awake. Missing topics: %s", missing_list.c_str());
                else:
                  - lambda: |-
                      uint8_t missing = (~id(seen_mask)) & 0x07;
                      std::string missing_list;
                      if (missing & 0x01) missing_list += (missing_list.empty() ? "" : ", ") + std::string("online_lock");
                      if (missing & 0x02) missing_list += (missing_list.empty() ? "" : ", ") + std::string("garage_status");
                      if (missing & 0x04) missing_list += (missing_list.empty() ? "" : ", ") + std::string("light_control");
                      if (missing == 0) {
                        ESP_LOGI("sleep", "Sleep timeout expired; proceeding to deep sleep with all retained topics present.");
                      } else {
                        if (missing_list.empty()) missing_list = "unknown";
                        ESP_LOGW("sleep", "Sleep timeout expired; forcing deep sleep despite missing topics: %s", missing_list.c_str());
                      }
                  - script.execute: publish_flags
                  - script.wait: publish_flags
                  - deep_sleep.allow: deep_sleep_1
          else:
            - if:
                condition:
                  lambda: 'return id(seen_mask) == 0x07;'
                then:
                  - if:
                      condition:
                        lambda: 'return !id(online_lock);'
                      then:
                        - lambda: 'ESP_LOGI("sleep", "All retained topics received; entering deep sleep.");'
                        - script.execute: publish_flags
                        - script.wait: publish_flags
                        - deep_sleep.allow: deep_sleep_1
                      else:
                        - logger.log: "Online lock active, remaining awake."
                else:
                  - lambda: |-
                      uint8_t missing = (~id(seen_mask)) & 0x07;
                      std::string missing_list;
                      if (missing & 0x01) missing_list += (missing_list.empty() ? "" : ", ") + std::string("online_lock");
                      if (missing & 0x02) missing_list += (missing_list.empty() ? "" : ", ") + std::string("garage_status");
                      if (missing & 0x04) missing_list += (missing_list.empty() ? "" : ", ") + std::string("light_control");
                      if (missing_list.empty()) missing_list = "unknown";
                      ESP_LOGI("sleep", "Waiting for retained topics before sleeping; still missing: %s", missing_list.c_str());

  # Retained snapshot of the flags used for this wake, published just before sleep.
  # The short delay lets the publish leave before deep sleep starts.
  - id: publish_flags
    mode: single
    then:
      - lambda: |-
          char buf[240];
          snprintf(buf, sizeof(buf),
            "{\"door_open\":%s,\"og_online\":%s,\"online_lock\":%s,\"door_known\":%s,\"wait_extra_s\":%u,\"awake_ms\":%u,\"wifi_ms\":%u,\"mqtt_ms\":%u}",
            id(door_open) ? "true" : "false",
            id(og_online) ? "true" : "false",
            id(online_lock) ? "true" : "false",
            id(door_known) ? "true" : "false",
            (unsigned)id(wait_extra_s),
            (unsigned)millis(),
            (unsigned)id(wifi_ms),
            (unsigned)id(mqtt_ms));
          id(mqtt_client)->publish(
            (std::string)App.get_name() + "/flags", buf, strlen(buf), 1, true);
      - delay: 300ms

  - id: online_lock_timeout_arm
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(online_lock);'
          then:
            - delay: 3min
            - if:
                condition:
                  lambda: 'return id(online_lock);'
                then:
                  - lambda: 'id(online_lock) = false;'
                  - script.execute: maybe_finish_and_sleep

safe_mode:
  on_safe_mode:
    then:
      - logger.log: "Safe mode triggered!"
      - deep_sleep.prevent: deep_sleep_1
